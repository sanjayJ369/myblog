<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="Before the fix: thread B increments the counter, which invalidates core A's copy of the whole cache line, so core A stalls on the CRC settings until the line comes back.">
<style>
  .fs1 text { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .fs1 .lbl { font-size: 13px; }
  .fs1 .sm { font-size: 11px; }
  .fs1 .ttl { font-size: 15px; font-weight: 600; }
  .fs1-writeB { animation: fs1-write 6s infinite; }
  .fs1-inv { animation: fs1-inv 6s infinite; opacity: 0; }
  .fs1-packet { animation: fs1-packet 6s infinite; opacity: 0; }
  .fs1-run { animation: fs1-run 6s infinite; }
  .fs1-stall { animation: fs1-stall 6s infinite; opacity: 0; }
  .fs1-bar { transform-box: fill-box; transform-origin: left center; animation: fs1-bar 6s infinite linear; }
  .fs1-bclone { animation: fs1-bclone 6s infinite; opacity: 0; }
  @keyframes fs1-write { 0%,18% { opacity: 0; } 20%,30% { opacity: 1; } 34%,100% { opacity: 0; } }
  @keyframes fs1-inv { 0%,21% { opacity: 0; } 23%,55% { opacity: 1; } 58%,100% { opacity: 0; } }
  @keyframes fs1-packet { 0%,30% { opacity: 0; transform: translateX(0); } 32% { opacity: 1; transform: translateX(0); } 52% { opacity: 1; transform: translateX(-320px); } 55%,100% { opacity: 0; transform: translateX(-320px); } }
  @keyframes fs1-run { 0%,21% { opacity: 1; } 23%,55% { opacity: 0; } 58%,100% { opacity: 1; } }
  @keyframes fs1-stall { 0%,21% { opacity: 0; } 23%,55% { opacity: 1; } 58%,100% { opacity: 0; } }
  @keyframes fs1-bar { 0% { transform: scaleX(0); } 22% { transform: scaleX(.3); } 56% { transform: scaleX(.3); } 100% { transform: scaleX(1); } }
  @keyframes fs1-bclone { 0%,17% { opacity: 0; } 19%,34% { opacity: 1; } 37%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .fs1-writeB, .fs1-inv, .fs1-stall, .fs1-bclone { animation: none; opacity: 1; }
    .fs1-packet, .fs1-run { animation: none; opacity: 0; }
    .fs1-bar { animation: none; transform: scaleX(.3); }
  }
</style>
<defs>
  <pattern id="fs1-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="var(--svg-bg-light)"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="var(--svg-accent-1)" stroke-width="3"/>
  </pattern>
</defs>
<g class="fs1">
  <!-- Core A -->
  <rect x="10" y="10" width="300" height="300" rx="6" fill="none" stroke="var(--svg-text-primary)" stroke-width="1.5"/>
  <text x="26" y="38" class="ttl" fill="var(--svg-text-primary)">Core A · thread A</text>
  <text x="26" y="72" class="sm" fill="var(--svg-text-secondary)">its cache: one 64-byte line</text>
  <rect x="26" y="82" width="54" height="44" fill="var(--svg-bg-subtle)" stroke="var(--svg-text-primary)"/>
  <text x="53" y="109" class="sm" text-anchor="middle" fill="var(--svg-text-primary)">strong</text>
  <rect x="80" y="82" width="54" height="44" fill="var(--svg-bg-subtle)" stroke="var(--svg-text-primary)"/>
  <text x="107" y="109" class="sm" text-anchor="middle" fill="var(--svg-text-primary)">weak</text>
  <rect x="134" y="82" width="160" height="44" fill="var(--svg-bg-light)" stroke="var(--svg-text-primary)"/>
  <text x="214" y="109" class="sm" text-anchor="middle" fill="var(--svg-text-primary)">CRC settings</text>
  <g class="fs1-inv">
    <rect x="26" y="82" width="268" height="44" fill="url(#fs1-hatch)" stroke="var(--svg-accent-1)" stroke-width="2"/>
    <rect x="104" y="93" width="112" height="22" fill="var(--svg-bg-light)"/>
    <text x="160" y="109" class="lbl" text-anchor="middle" fill="var(--svg-accent-1)" font-weight="600">INVALID</text>
  </g>
  <text x="26" y="176" class="lbl fs1-run" fill="var(--svg-text-primary)">CRC run: reading settings…</text>
  <text x="26" y="176" class="lbl fs1-stall" fill="var(--svg-accent-1)" font-weight="600">stalled: waiting for the line</text>
  <rect x="26" y="192" width="268" height="12" fill="var(--svg-bg-subtle)" stroke="var(--svg-border)"/>
  <rect x="26" y="192" width="268" height="12" class="fs1-bar" fill="var(--svg-text-primary)"/>
  <text x="26" y="226" class="sm" fill="var(--svg-text-secondary)">checksum progress on this page</text>

  <!-- Core B -->
  <rect x="350" y="10" width="300" height="300" rx="6" fill="none" stroke="var(--svg-text-primary)" stroke-width="1.5"/>
  <text x="366" y="38" class="ttl" fill="var(--svg-text-primary)">Core B · thread B</text>
  <text x="366" y="72" class="sm" fill="var(--svg-text-secondary)">its cache: the same line</text>
  <rect x="366" y="82" width="54" height="44" fill="var(--svg-bg-subtle)" stroke="var(--svg-text-primary)"/>
  <text x="393" y="109" class="sm" text-anchor="middle" fill="var(--svg-text-primary)">strong</text>
  <rect x="366" y="82" width="54" height="44" class="fs1-writeB" fill="var(--svg-accent-1)"/>
  <text x="393" y="109" class="sm fs1-writeB" text-anchor="middle" fill="var(--svg-bg-light)" font-weight="600">+1</text>
  <rect x="420" y="82" width="54" height="44" fill="var(--svg-bg-subtle)" stroke="var(--svg-text-primary)"/>
  <text x="447" y="109" class="sm" text-anchor="middle" fill="var(--svg-text-primary)">weak</text>
  <rect x="474" y="82" width="160" height="44" fill="var(--svg-bg-light)" stroke="var(--svg-text-primary)"/>
  <text x="554" y="109" class="sm" text-anchor="middle" fill="var(--svg-text-primary)">CRC settings</text>
  <text x="366" y="176" class="lbl" fill="var(--svg-text-primary)">reads its next page</text>
  <text x="366" y="200" class="lbl fs1-bclone" fill="var(--svg-accent-1)" font-weight="600">Arc::clone → strong += 1</text>

  <!-- The line travelling from B back to A -->
  <g class="fs1-packet">
    <rect x="420" y="250" width="160" height="34" rx="4" fill="var(--svg-bg-subtle)" stroke="var(--svg-accent-1)" stroke-width="1.5"/>
    <text x="500" y="272" class="sm" text-anchor="middle" fill="var(--svg-text-primary)">64-byte line → core A</text>
  </g>
</g>
</svg>
