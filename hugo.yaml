baseURL: https://blog.sanjayj.dev/
languageCode: en-us
title: Sanjay's Blog
theme: captains-desk # local theme in themes/captains-desk; design language in DESIGN.md
googleAnalytics: "G-M5Y3YNK58R"
buildFuture: true
capitalizeListTitles: false # keep tag names lower-case, as written
enableRobotsTXT: true

menu:
  main:
    - identifier: Archives
      name: Archives
      url: /archives/
      weight: 10
    - identifier: Tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: Search
      name: Search
      url: /search/
      weight: 30

params:
  author: Sanjay J.
  description: "Long-form notes on databases, distributed systems and networks, written while learning."
  favicon: favicon.webp
  mainSections: ["posts"]

  home:
    title: "Notes from my <em>readings.</em>"
    intro: >
      I write long-form notes while I learn how storage engines, file systems and networks
      actually work, from buffer pools and B+ trees to GFS and MapReduce. Most entries follow
      a lecture or a paper and try to explain it plainly.


      Away from the keyboard I make 3D art and play chess.

  socialIcons:
    - name: github
      url: "https://github.com/sanjayJ369"
    - name: sanjayj.dev
      url: "https://sanjayj.dev"

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false # lets the image render hook emit <figure> for block images
  highlight:
    noClasses: false # Chroma emits classes; colours come from the theme tokens
    codeFences: true
    guessSyntax: false

outputs:
  home:
    - HTML
    - RSS
    - JSON # search index, read by themes/captains-desk/assets/js/search.js
